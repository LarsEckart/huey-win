name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags="-H windowsgui" -o huey-win.exe .
        env:
          CGO_ENABLED: 1

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v6
        with:
          name: huey-win-unsigned
          path: huey-win.exe
          retention-days: 90

  sign:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: huey-win-unsigned

      - name: Upload artifact for signing
        id: upload-for-signing
        uses: actions/upload-artifact@v6
        with:
          name: huey-win-to-sign
          path: huey-win.exe

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: huey-win
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@v6
        with:
          name: huey-win
          path: signed/huey-win.exe
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: huey-win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: huey-win.exe
          generate_release_notes: true
